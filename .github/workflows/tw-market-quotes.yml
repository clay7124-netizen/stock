name: 台股官方收盤價公開備援
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_quotes.py
      - .github/workflows/tw-market-quotes.yml
  schedule:
    # UTC 05:40/05:55/06:10 = Asia/Taipei 13:40/13:55/14:10
    - cron: '40,55 5 * * 1-5'
    - cron: '10 6 * * 1-5'
permissions:
  contents: write
concurrency:
  group: public-tw-quotes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3'
      - run: python scripts/collect_quotes.py
        env:
          TZ: Asia/Taipei
      - name: Save verified public quotes only
        run: |
          git config user.name "public-tw-quotes-bot"
          git config user.email "public-tw-quotes-bot@users.noreply.github.com"
          git add prices/
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified TWSE/TPEx closing prices"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

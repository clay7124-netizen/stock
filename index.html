      const data = rawData.map(d => ({ ...d }));

        if (i >= 4) {
          const sum5 = data.slice(i - 4, i + 1).reduce((a, b) => a + b.close, 0);
          data[i].ma5 = parseFloat((sum5 / 5).toFixed(2));
        }
        if (i >= 19) {
          const slice20 = data.slice(i - 19, i + 1);
          const mean20 = slice20.reduce((a, b) => a + b.close, 0) / 20;
          const variance = slice20.reduce((a, b) => a + Math.pow(b.close - mean20, 2), 0) / 20;
          const stdDev = Math.sqrt(variance);
          data[i].ma20 = parseFloat(mean20.toFixed(2));
          data[i].bbUpper = parseFloat((mean20 + 2 * stdDev).toFixed(2));
          data[i].bbLower = parseFloat((mean20 - 2 * stdDev).toFixed(2));
        }
        if (i >= 59) {
          const sum60 = data.slice(i - 59, i + 1).reduce((a, b) => a + b.close, 0);
          data[i].ma60 = parseFloat((sum60 / 60).toFixed(2));
        }

        const baseVal = data[i].ma20 || data[i].close;
        data[i].riverHigh = parseFloat((baseVal * 1.18).toFixed(2));
        data[i].riverMidHigh = parseFloat((baseVal * 1.09).toFixed(2));
        data[i].riverMid = parseFloat(baseVal.toFixed(2));
        data[i].riverLow = parseFloat((baseVal * 0.85).toFixed(2));
      }

      let k = 50, d = 50;
      for (let i = 0; i < data.length; i++) {
        const startIdx = Math.max(0, i - 8);
        const windowSlice = data.slice(startIdx, i + 1);
        const highestHigh = Math.max(...windowSlice.map(x => x.high));
        const lowestLow = Math.min(...windowSlice.map(x => x.low));
        let rsv = 50;
        if (highestHigh !== lowestLow) {
          rsv = ((data[i].close - lowestLow) / (highestHigh - lowestLow)) * 100;
        }
        k = (2 / 3) * k + (1 / 3) * rsv;
        d = (2 / 3) * d + (1 / 3) * k;
        data[i].k = parseFloat(k.toFixed(1));
        data[i].d = parseFloat(d.toFixed(1));

      let dea = 0;
      const k12 = 2 / 13, k26 = 2 / 27, k9 = 2 / 10;

      for (let i = 0; i < data.length; i++) {
        const c = data[i].close;
        ema12 = c * k12 + ema12 * (1 - k12);
        ema26 = c * k26 + ema26 * (1 - k26);
        const dif = ema12 - ema26;
        dea = dif * k9 + dea * (1 - k9);
        const osc = dif - dea;
        data[i].dif = parseFloat(dif.toFixed(2));
        data[i].macd = parseFloat(dea.toFixed(2));
        data[i].osc = parseFloat(osc.toFixed(2));
      }

      let avgGain = 0, avgLoss = 0;
      for (let i = 0; i < data.length; i++) {
        if (i === 0) { data[i].rsi = 50; continue; }
        const diff = data[i].close - data[i - 1].close;
        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? -diff : 0;
        if (i <= 14) {
          avgGain = (avgGain * (i - 1) + gain) / i;
          avgLoss = (avgLoss * (i - 1) + loss) / i;
        } else {
          avgGain = (avgGain * 13 + gain) / 14;
          avgLoss = (avgLoss * 13 + loss) / 14;
        }
        data[i].rsi = avgLoss === 0 ? 100 : parseFloat((100 - 100 / (1 + avgGain / avgLoss)).toFixed(1));
      }

      return data;
    };

    const calculateMetrics = (price, prevClose, high, low, open) => {
      if (!price || !prevClose) return { valuation: '-', health: 50, riverTrend: '-', trendScore: 0 };
      let valuation = '合理', position = 0.5;
      if (high > low) position = (price - low) / (high - low);
      if (position < 0.25) valuation = '便宜';
      else if (position > 0.75) valuation = '昂貴';
      const changePercent = prevClose > 0 ? ((price - prevClose) / prevClose) * 100 : 0;
      let rawScore = 60 + (changePercent * 5) + (position * 20);
      if (price > open) rawScore += 5;
      const health = Math.min(99, Math.max(35, Math.floor(rawScore)));
      const riverTrend = changePercent > 1.2 ? '強勢上攻' : changePercent > 0 ? '緩步墊高' : changePercent > -1.0 ? '盤整修正' : '空方下行';
      return { valuation, health, riverTrend, trendScore: changePercent };
    };

      }).map(enhanceStockData);

    const fetchWithProxyRace = async (targetUrl, timeoutMs = 4500) => {
      const encoded = encodeURIComponent(targetUrl);
      const proxyNodes = [
        `https://api.codetabs.com/v1/proxy?quest=${encoded}`,
        `https://corsproxy.io/?${encoded}`,
        `https://api.allorigins.win/raw?url=${encoded}`
      ];

      const fetchNode = async (url) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) throw new Error('Status ' + res.status);
          const text = await res.text();
          const json = JSON.parse(text);
          const actual = json.contents ? JSON.parse(json.contents) : json;
          if (!actual) throw new Error('Empty JSON');
          return actual;
        } catch (e) {
          clearTimeout(timer);
          throw e;
        }
      };

      return await Promise.any(proxyNodes.map(node => fetchNode(node)));
    };

    const fetchFinMindChart = async (symbol, rangeType, market) => {
      const cleanId = symbol.replace('.TW', '').replace('.TWO', '').toUpperCase();
      const dataset = market === 'TW' ? 'TaiwanStockPrice' : 'USStockPrice';
      const startDate = new Date();
      switch (rangeType) {
        case '1D':
        case '1W': startDate.setDate(startDate.getDate() - 95); break;
        case '1M': startDate.setMonth(startDate.getMonth() - 4); break;
        case '3M': startDate.setMonth(startDate.getMonth() - 6); break;
        case '6M': startDate.setMonth(startDate.getMonth() - 9); break;
        case '1Y': startDate.setFullYear(startDate.getFullYear() - 1); startDate.setMonth(startDate.getMonth() - 3); break;
        case '5Y': startDate.setFullYear(startDate.getFullYear() - 5); break;
        default: startDate.setFullYear(startDate.getFullYear() - 10); break;
      }
      const startStr = startDate.toISOString().split('T')[0];
      const url = `https://api.finmindtrade.com/api/v4/data?dataset=${dataset}&data_id=${cleanId}&start_date=${startStr}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error('FinMind HTTP error');
      const json = await res.json();
      if (!json.data || json.data.length === 0) throw new Error('FinMind empty');

      let rawList = json.data.map(item => ({
        date: item.date,
        open: Number(item.open ?? item.Open ?? item.close ?? item.Close),
        high: Number(item.max ?? item.High ?? item.close ?? item.Close),
        low: Number(item.min ?? item.Low ?? item.close ?? item.Close),
        close: Number(item.close ?? item.Close),
        volume: Number(item.Trading_Volume ?? item.Volume ?? 0)
      })).filter(x => x.close > 0);

      if (['5Y', '10Y', 'ALL'].includes(rangeType) && rawList.length > 180) {
        const step = rangeType === '5Y' ? 5 : 15;
        rawList = rawList.filter((_, idx) => idx % step === 0 || idx === rawList.length - 1);
      }

      const enriched = enrichTechnicalIndicators(rawList);
      const sliceMap = { '1D': 15, '1W': 15, '1M': 25, '3M': 65, '6M': 130, '1Y': 255 };
      const targetLen = sliceMap[rangeType];
      return targetLen ? enriched.slice(-targetLen) : enriched;
    };

    const fetchYahooChart = async (symbol, rangeType, market) => {
      const cleanId = symbol.replace('.TW', '').replace('.TWO', '');
      let range = '3mo', interval = '1d';
      switch (rangeType) {
        case '1D': range = '5d'; interval = '15m'; break;
        case '1W': range = '1mo'; interval = '1h'; break;
        case '1M': range = '3mo'; interval = '1d'; break;
        case '3M': range = '6mo'; interval = '1d'; break;
        case '6M': range = '1y'; interval = '1d'; break;
        case '1Y': range = '2y'; interval = '1d'; break;
        case '5Y': range = '5y'; interval = '1wk'; break;
        default: range = '10y'; interval = '1mo'; break;
      }

      const candidates = market === 'TW' ? [`${cleanId}.TW`, `${cleanId}.TWO`] : [cleanId];
      const tasks = [];
      candidates.forEach(sym => {
        tasks.push(fetchWithProxyRace(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=${range}&interval=${interval}`));
      });

      const data = await Promise.any(tasks);
      const result = data.chart?.result?.[0];
      if (!result || !result.timestamp) throw new Error('Yahoo empty');

      const timestamps = result.timestamp;
      const q = result.indicators.quote[0];
      const rawList = timestamps.map((ts, idx) => {
        const close = q.close[idx];
        if (close == null) return null;
        const d = new Date(ts * 1000);
        const dateStr = ['15m', '1h'].includes(interval)
          ? `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
          : d.toISOString().split('T')[0];
        return {
          date: dateStr,
          open: parseFloat((q.open[idx] || close).toFixed(2)),
          high: parseFloat((q.high[idx] || close).toFixed(2)),
          low: parseFloat((q.low[idx] || close).toFixed(2)),
          close: parseFloat(close.toFixed(2)),
          volume: q.volume[idx] || 0
        };
      }).filter(Boolean);

      const enriched = enrichTechnicalIndicators(rawList);
      const sliceMap = { '1D': 35, '1W': 45, '1M': 25, '3M': 65, '6M': 130, '1Y': 255 };
      const targetLen = sliceMap[rangeType];
      return targetLen ? enriched.slice(-targetLen) : enriched;
    };

    const fetchMasterChartData = async (symbol, rangeType, market, fKey, tKey, forceRefresh = false) => {
      const cacheKey = `${market}_${symbol}_${rangeType}`;
      if (!forceRefresh && CHART_CACHE.has(cacheKey)) return CHART_CACHE.get(cacheKey);

      const cleanId = symbol.replace('.TW', '').replace('.TWO', '');
      const competitors = [];

      if (rangeType !== '1D') {
        competitors.push(fetchFinMindChart(cleanId, rangeType, market).then(data => ({ data, source: 'FinMind 開源直連' })));
      }
      competitors.push(fetchYahooChart(symbol, rangeType, market).then(data => ({ data, source: 'Yahoo 全域節點' })));
      if (rangeType === '1D') {
        competitors.push(fetchFinMindChart(cleanId, '1M', market).then(data => ({ data: data.slice(-15), source: 'FinMind 近期K線' })));
      }

      const winner = await Promise.any(competitors);
      if (winner && winner.data && winner.data.length > 0) {
        CHART_CACHE.set(cacheKey, winner);
        return winner;
      }
      throw new Error('All chart engines failed');
    };

    const fetchRealtimeQuote = async (stock, market, fKey, tKey) => {
      const cleanId = String(stock.id).replace('.TW', '').replace('.TWO', '').toUpperCase();
      let realData = null, source = '';

      if (market === 'US' && fKey) {
        try {
          const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${cleanId}&token=${fKey}`);
          if (res.ok) {
            const data = await res.json();
            if (data.c > 0) {
              realData = { price: data.c, prevClose: data.pc, change: data.d, changePercent: data.dp, high: data.h, low: data.l, open: data.o };
              source = 'Finnhub';
            }
          }
        } catch (e) {}
      }

      if (market === 'TW' && tKey && !realData) {
        try {
          const res = await fetch(`https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/${cleanId}`, { headers: { 'X-API-KEY': tKey } });
          if (res.ok) {
            const json = await res.json();
            const quote = json.lastTrade?.price || json.closingPrice || json.previousClose;
            const prev = json.previousClose || quote;
            if (quote > 0) {
              realData = {
                price: quote, prevClose: prev, change: quote - prev,
                changePercent: prev > 0 ? ((quote - prev) / prev) * 100 : 0,
                high: json.highPrice || quote, low: json.lowPrice || quote, open: json.openPrice || prev
              };
              source = 'Fugle';
            }
          }
        } catch (e) {}
      }

      if (!realData) {
        try {
          const candidates = market === 'TW' ? [`${cleanId}.TW`, `${cleanId}.TWO`] : [cleanId];
          const data = await Promise.any(
            candidates.map(sym => fetchWithProxyRace(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=1d&interval=5m`, 3500))
          );
          const meta = data.chart?.result?.[0]?.meta;
          if (meta && meta.regularMarketPrice > 0) {
            const p = meta.regularMarketPrice;
            const pc = meta.chartPreviousClose || meta.previousClose || p;
            realData = {
              price: p, prevClose: pc, change: p - pc,
              changePercent: pc > 0 ? ((p - pc) / pc) * 100 : 0,
              high: meta.regularMarketDayHigh || p, low: meta.regularMarketDayLow || p, open: meta.regularMarketOpen || pc
            };
            source = 'Yahoo';
          }
        } catch (e) {}
      }

      if (!realData) {
        try {
          const dataset = market === 'TW' ? 'TaiwanStockPrice' : 'USStockPrice';
          const d = new Date(); d.setDate(d.getDate() - 10);
          const res = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=${dataset}&data_id=${cleanId}&start_date=${d.toISOString().split('T')[0]}`);
          if (res.ok) {
            const json = await res.json();
            if (json.data && json.data.length > 0) {
              const last = json.data[json.data.length - 1];
              const prevItem = json.data.length > 1 ? json.data[json.data.length - 2] : last;
              const p = Number(last.close ?? last.Close);
              const pc = Number(prevItem.close ?? prevItem.Close ?? p);
              const spread = last.spread !== undefined ? Number(last.spread) : (p - pc);
              const prevBase = p - spread;
              realData = {
                price: p, prevClose: prevBase, change: spread,
                changePercent: prevBase > 0 ? (spread / prevBase) * 100 : 0,
                high: Number(last.max ?? last.High ?? p), low: Number(last.min ?? last.Low ?? p), open: Number(last.open ?? last.Open ?? p)
              };
              source = 'FinMind';
            }
          }
        } catch (e) {}
      }

      if (realData) {
        const metrics = calculateMetrics(realData.price, realData.prevClose, realData.high, realData.low, realData.open);
        return { ...enhanceStockData(stock), ...realData, ...metrics, source, errorMsg: '' };
      }
      return { ...enhanceStockData(stock), errorMsg: stock.price > 0 ? '' : '休市/待連線' };
    };

      const handleBatchSubmit = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;
        const tokens = searchQuery.split(/[\s,，;；]+/).filter(Boolean);
        setSearchQuery('');
        for (const token of tokens) {
          const matchedEntry = Object.entries(STOCK_DICT).find(([code, info]) => code === token.toUpperCase() || info.name === token);
          if (matchedEntry) await commitAddStock(matchedEntry[0], matchedEntry[1].name);
          else await commitAddStock(token, token);
        }
      };

      const handleAddGroup = () => {
        const trimmed = newGroupName.trim();
        if (!trimmed) return;
        if (market === 'TW') { if (!groupsTW.includes(trimmed)) setGroupsTW([...groupsTW, trimmed]); setActiveGroupTW(trimmed); }
        else { if (!groupsUS.includes(trimmed)) setGroupsUS([...groupsUS, trimmed]); setActiveGroupUS(trimmed); }
        setNewGroupName(''); setShowNewGroupInput(false);
        showToast(`📁 已建立群組「${trimmed}」`);
      };

      const currentRawList = market === 'TW' ? watchlistTW : watchlistUS;
      const currentGroups = market === 'TW' ? groupsTW : groupsUS;
      const activeGroup = market === 'TW' ? activeGroupTW : activeGroupUS;
      const setActiveGroup = market === 'TW' ? setActiveGroupTW : setActiveGroupUS;

      const displayedList = useMemo(() => {
        let filtered = activeGroup === '全部' ? [...currentRawList] : currentRawList.filter(s => s.group === activeGroup);
        filtered.sort((a, b) => {
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          switch (sortBy) {
            case 'changeDesc': return b.changePercent - a.changePercent;
            case 'changeAsc': return a.changePercent - b.changePercent;
            case 'priceDesc': return b.price - a.price;
            case 'healthDesc': return b.health - a.health;
            case 'idAsc': return a.id.localeCompare(b.id);
            default: return 0;
          }
        });
        return filtered;
      }, [currentRawList, activeGroup, sortBy]);

      const activeStockObj = useMemo(() => {
        const all = [...watchlistTW, ...watchlistUS];
        return all.find(s => s.id === selectedStockId) || currentRawList[0] || INITIAL_STOCKS_TW[0];
      }, [watchlistTW, watchlistUS, selectedStockId, currentRawList]);

      const getColor = (val) => val > 0 ? 'text-rose-500' : val < 0 ? 'text-emerald-500' : (darkMode ? 'text-slate-300' : 'text-slate-700');
      const getBgBadge = (val) => val > 0 ? 'bg-rose-500/15 text-rose-400 border-rose-500/30' : val < 0 ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' : 'bg-slate-500/15 text-slate-400 border-slate-500/20';

      return (
        <div className={`min-h-screen font-sans transition-colors duration-300 ${darkMode ? 'bg-[#090D16] text-slate-100' : 'bg-slate-100 text-slate-900'}`}>
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-2xl flex items-center gap-2">
              <Sparkles size={14} /> {toastMsg}
            </div>
          )}

          <header className={`sticky top-0 z-30 backdrop-blur-xl border-b ${darkMode ? 'bg-[#090D16]/85 border-slate-800/80' : 'bg-white/85 border-slate-200/80'}`}>
            <div className="max-w-[1440px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                  <Zap size={19} fill="currentColor" className="text-amber-300" />
                </div>
                <div>
                  <h1 className="text-base font-extrabold tracking-tight">StockMaster <span className="text-indigo-500">PRO</span></h1>
                  <span className="text-[10px] text-slate-400 font-mono">台美股雙棲即時看盤工作站 v4.1</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <div className={`flex p-1 rounded-xl border ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-100 border-slate-200'}`}>
                  {['TW', 'US'].map(m => (
                    <button
                      key={m}
                      onClick={() => { setMarket(m); setActiveTab('market'); }}
                      className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${market === m && activeTab === 'market' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400'}`}
                    >
                      {m === 'TW' ? `🇹🇼 台股 (${watchlistTW.length})` : `🇺🇸 美股 (${watchlistUS.length})`}
                    </button>
                  ))}
                </div>
                <button onClick={runUpdateCycle} className={`p-2 rounded-xl border ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-white border-slate-200 text-slate-600'} ${isUpdating ? 'animate-spin text-indigo-500' : ''}`}>
                  <RefreshCw size={15} />
                </button>
                <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-xl border ${darkMode ? 'bg-slate-900 border-slate-800 text-amber-400' : 'bg-white border-slate-200 text-slate-700'}`}>
                  {darkMode ? <Sun size={15} /> : <Moon size={15} />}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-[1440px] mx-auto px-4 py-4 pb-20">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              {/* Left Column */}
              <div className={`lg:col-span-5 xl:col-span-4 space-y-3 ${mobileDetailOpen ? 'hidden lg:block' : 'block'}`}>
                <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  {currentGroups.map(grp => (
                    <button
                      key={grp}
                      onClick={() => setActiveGroup(grp)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeGroup === grp ? 'bg-indigo-600 text-white' : (darkMode ? 'bg-slate-900 text-slate-400 border border-slate-800' : 'bg-white text-slate-600 border border-slate-200')}`}
                    >
                      {grp}
                    </button>
                  ))}
                  {showNewGroupInput ? (
                    <div className="flex items-center gap-1 shrink-0">
                      <input value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder="群組名稱..." className={`w-24 px-2 py-1 rounded-lg text-xs border ${darkMode ? 'bg-slate-900 border-indigo-500 text-white' : 'bg-white border-indigo-500'}`} autoFocus onKeyDown={e => e.key === 'Enter' && handleAddGroup()} />
                      <button onClick={handleAddGroup} className="p-1.5 bg-indigo-600 text-white rounded-lg"><Check size={12} /></button>
                    </div>
                  ) : (
                    <button onClick={() => setShowNewGroupInput(true)} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shrink-0 border ${darkMode ? 'bg-slate-900 border-slate-800 text-indigo-400' : 'bg-white border-slate-200 text-indigo-600'}`}>
                      <FolderPlus size={13} /> 新群組
                    </button>
                  )}
                </div>

                <div className="flex items-center justify-between gap-2">
                  <select value={sortBy} onChange={e => setSortBy(e.target.value)} className={`text-xs font-bold rounded-lg px-2.5 py-1.5 border outline-none ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-white border-slate-200 text-slate-700'}`}>
                    <option value="custom">📌 釘選優先</option>
                    <option value="changeDesc">🔥 漲幅最高優先</option>
                    <option value="changeAsc">💧 跌幅最大優先</option>
                    <option value="priceDesc">💰 股價由高到低</option>
                    <option value="idAsc">🔢 依代號排序</option>
                  </select>

                  <button onClick={() => setShowSearch(!showSearch)} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white flex items-center gap-1">
                    {showSearch ? <><X size={14} /> 收起面板</> : <><Plus size={14} /> 連續新增股票</>}
                  </button>
                </div>

                {showSearch && (
                  <div className={`p-3.5 rounded-2xl border shadow-xl space-y-3 ${darkMode ? 'bg-slate-900 border-indigo-500/40' : 'bg-white border-indigo-200'}`}>
                    <form onSubmit={handleBatchSubmit} className="flex gap-2">
                      <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="輸入中文或代號 (如 00631L 00981A)..." className={`flex-1 px-3 py-2 rounded-xl text-xs border outline-none ${darkMode ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200'}`} autoFocus />
                      <button type="submit" className="px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">加入</button>
                    </form>

                    {suggestions.length > 0 && (
                      <div className={`rounded-xl border divide-y overflow-hidden ${darkMode ? 'bg-slate-950 border-slate-800 divide-slate-800' : 'bg-slate-50 border-slate-200 divide-slate-200'}`}>
                        {suggestions.map(s => (
                          <div key={s.symbol} onClick={() => commitAddStock(s.symbol, s.description)} className="px-3 py-2 flex items-center justify-between cursor-pointer hover:bg-indigo-500/10">
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold">{s.isTW ? '台股' : '美股'}</span>
                              <span className="font-mono font-bold text-xs text-indigo-400">{s.symbol}</span>
                              <span className="text-xs font-bold">{s.description}</span>
                            </div>
                            <span className="text-[10px] font-bold text-indigo-400">+ 秒加</span>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="space-y-2">
                      {(HOT_CATEGORIES[market] || []).map(cat => (
                        <div key={cat.label}>
                          <div className="text-[10px] font-bold text-slate-400 mb-1">{cat.label}</div>
                          <div className="flex flex-wrap gap-1.5">
                            {cat.items.map(code => {
                              const exists = currentRawList.some(s => s.id === code);
                              return (
                                <button key={code} type="button" onClick={() => commitAddStock(code, STOCK_DICT[code]?.name)} className={`px-2 py-1 rounded-lg text-[11px] font-bold border flex items-center gap-1 ${exists ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-400' : (darkMode ? 'bg-slate-800 border-slate-700 text-slate-200' : 'bg-slate-100 border-slate-200 text-slate-700')}`}>
                                  {exists && <Check size={10} />}
                                  <span>{STOCK_DICT[code]?.name || code}</span>
                                  <span className="opacity-60 font-mono text-[10px]">{code}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="space-y-2">
                  {displayedList.map(stock => {
                    const isSelected = stock.id === activeStockObj?.id;
                    return (
                      <div
                        key={stock.id}
                        onClick={() => { setSelectedStockId(stock.id); setMobileDetailOpen(true); }}
                        className={`rounded-2xl border p-3.5 transition-all cursor-pointer flex items-center justify-between gap-3 ${isSelected ? (darkMode ? 'bg-indigo-950/40 border-indigo-500' : 'bg-indigo-50 border-indigo-500') : (darkMode ? 'bg-slate-900/75 border-slate-800' : 'bg-white border-slate-200')}`}
                      >
                        <div className={`w-1.5 self-stretch rounded-full shrink-0 ${stock.change > 0 ? 'bg-rose-500' : stock.change < 0 ? 'bg-emerald-500' : 'bg-slate-500'}`} />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-1.5">
                            {stock.pinned && <Pin size={12} className="text-amber-400 fill-amber-400 shrink-0" />}
                            <span className="font-extrabold text-[15px] truncate">{stock.name}</span>
                            <span className="text-[11px] font-mono text-slate-400">{stock.id}</span>
                          </div>
                          <div className="text-[10px] text-slate-400 mt-1">{stock.sector} • {stock.group}</div>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <div className="text-right">
                            {stock.price > 0 ? (
                              <>
                                <div className={`text-lg font-extrabold font-mono leading-none ${getColor(stock.change)}`}>{stock.price.toFixed(2)}</div>
                                <div className={`inline-block text-[11px] font-mono font-bold px-1.5 py-0.5 rounded border mt-1 ${getBgBadge(stock.change)}`}>
                                  {stock.change > 0 ? '+' : ''}{stock.changePercent.toFixed(2)}%
                                </div>
                              </>
                            ) : <div className="text-xs font-mono text-slate-400">連線中...</div>}
                          </div>
                          <div className="flex flex-col gap-1 pl-1 border-l border-slate-800/30">
                            <button onClick={(e) => { e.stopPropagation(); const setter = market === 'TW' ? setWatchlistTW : setWatchlistUS; setter(prev => prev.map(s => s.id === stock.id ? { ...s, pinned: !s.pinned } : s)); }} className={`p-1 rounded ${stock.pinned ? 'text-amber-400' : 'text-slate-500'}`}><Pin size={13} /></button>
                            <button onClick={(e) => { e.stopPropagation(); const setter = market === 'TW' ? setWatchlistTW : setWatchlistUS; setter(prev => prev.filter(s => s.id !== stock.id)); }} className="p-1 rounded text-slate-500 hover:text-rose-500"><Trash2 size={13} /></button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Right Column: Chart & Technicals */}
              <div className={`lg:col-span-7 xl:col-span-8 ${mobileDetailOpen ? 'block' : 'hidden lg:block'}`}>
                {activeStockObj && (
                  <StockWorkstationDetail
                    stock={activeStockObj}
                    darkMode={darkMode}
                    market={isTaiwanStock(activeStockObj.id) ? 'TW' : 'US'}
                    finnhubKey={finnhubKey}
                    fugleKey={fugleKey}
                    onBackMobile={() => setMobileDetailOpen(false)}
                    getColor={getColor}
                    getBgBadge={getBgBadge}
                  />
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    function StockWorkstationDetail({ stock, darkMode, market, finnhubKey, fugleKey, onBackMobile, getColor, getBgBadge }) {
      const [chartType, setChartType] = useState('kline');
      const [timeRange, setTimeRange] = useState('3M');
      const [showMA, setShowMA] = useState(true);
      const [showBB, setShowBB] = useState(false);
      const [subIndicator, setSubIndicator] = useState('kd');
      const [chartData, setChartData] = useState([]);
      const [isLoadingChart, setIsLoadingChart] = useState(false);
      const [dataSource, setDataSource] = useState('');
      const [hoverCandle, setHoverCandle] = useState(null);
      const [aiAnalysis, setAiAnalysis] = useState(null);

      const loadChart = async (force = false) => {
        setIsLoadingChart(true);
        try {
          const res = await fetchMasterChartData(stock.symbol, timeRange, market, finnhubKey, fugleKey, force);
          if (res && res.data) {
            setChartData(res.data);
            setDataSource(res.source);
            setHoverCandle(res.data[res.data.length - 1]);
          }
        } catch (e) { setChartData([]); }
        setIsLoadingChart(false);
      };

      useEffect(() => { setAiAnalysis(null); loadChart(false); }, [stock.symbol, timeRange, market]);

      const latestCandle = chartData.length > 0 ? chartData[chartData.length - 1] : null;
      const activeCandle = hoverCandle || latestCandle;

      return (
        <div className={`rounded-3xl border p-4 sm:p-6 space-y-4 ${darkMode ? 'bg-slate-900/80 border-slate-800' : 'bg-white border-slate-200'}`}>
          <div className="flex flex-wrap items-start justify-between gap-4 border-b pb-4 border-slate-800/40">
            <div className="flex items-center gap-3">
              <button onClick={onBackMobile} className="lg:hidden p-2 rounded-xl border border-slate-700"><ArrowLeft size={18} /></button>
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-xl sm:text-2xl font-extrabold">{stock.name}</h2>
                  <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-indigo-500/15 text-indigo-400">{stock.id}</span>
                </div>
                <p className="text-xs text-slate-400 mt-1">{stock.desc}</p>
              </div>
            </div>
            <div className="text-right ml-auto">
              {stock.price > 0 && (
                <>
                  <div className={`text-3xl font-extrabold font-mono ${getColor(stock.change)}`}>{stock.price.toFixed(2)}</div>
                  <div className={`text-xs font-mono font-bold mt-1 ${getColor(stock.change)}`}>
                    {stock.change > 0 ? '▲ +' : '▼ '}{stock.change.toFixed(2)} ({stock.changePercent.toFixed(2)}%)
                  </div>
                </>
              )}
            </div>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex gap-1.5">
              {[{ id: 'kline', label: '🕯️ K線主圖' }, { id: 'trend', label: '📈 趨勢圖' }, { id: 'river', label: '🌊 河流圖' }].map(t => (
                <button key={t.id} onClick={() => setChartType(t.id)} className={`px-3 py-1.5 text-xs font-bold rounded-lg ${chartType === t.id ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>{t.label}</button>
              ))}
            </div>
            <div className="flex gap-1.5">
              <button onClick={() => setShowMA(!showMA)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border ${showMA ? 'bg-amber-500/15 border-amber-500/40 text-amber-300' : 'border-slate-800 text-slate-500'}`}>✓ 均線 MA5/20/60</button>
              <button onClick={() => setShowBB(!showBB)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border ${showBB ? 'bg-cyan-500/15 border-cyan-500/40 text-cyan-300' : 'border-slate-800 text-slate-500'}`}>✓ 布林 BB(20,2)</button>
            </div>
          </div>

          <div className="flex items-center justify-between gap-1.5 overflow-x-auto no-scrollbar">
            <div className="flex gap-1.5">
              {['1D', '1W', '1M', '3M', '6M', '1Y', '5Y', 'ALL'].map(r => (
                <button key={r} onClick={() => setTimeRange(r)} className={`px-3 py-1 rounded-lg text-[11px] font-bold ${timeRange === r ? 'bg-indigo-500 text-white' : 'bg-slate-800/70 text-slate-400'}`}>{r}</button>
              ))}
            </div>
            <span className="text-[10px] font-mono text-slate-400">{dataSource}</span>
          </div>

          {activeCandle && (
            <div className="px-3 py-2 rounded-xl bg-slate-950/80 border border-slate-800 text-[11px] font-mono flex flex-wrap gap-x-4 gap-y-1">
              <span className="text-indigo-400 font-bold">{activeCandle.date}</span>
              <span>開:{activeCandle.open}</span>
              <span className="text-rose-400">高:{activeCandle.high}</span>
              <span className="text-emerald-400">低:{activeCandle.low}</span>
              <span>收:{activeCandle.close}</span>
              {showMA && <><span className="text-amber-400">MA5:{activeCandle.ma5 || '-'}</span><span className="text-purple-400">MA20:{activeCandle.ma20 || '-'}</span><span className="text-sky-400">MA60:{activeCandle.ma60 || '-'}</span></>}
            </div>
          )}

          <div className="rounded-2xl border border-slate-800 bg-[#0B101B] p-3 space-y-3">
            {isLoadingChart ? (
              <div className="h-[360px] flex flex-col items-center justify-center gap-2 text-slate-400">
                <Loader2 size={26} className="animate-spin text-indigo-500" />
                <span className="text-xs">載入真實歷史 K 線與技術指標...</span>
              </div>
            ) : chartData.length > 0 ? (
              <>
                <div className="h-[250px] w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <ComposedChart data={chartData} onMouseMove={(s) => s?.activePayload?.[0]?.payload && setHoverCandle(s.activePayload[0].payload)}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" />
                      <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#64748b' }} axisLine={false} tickLine={false} minTickGap={35} />
                      <YAxis domain={['auto', 'auto']} orientation="right" tick={{ fontSize: 10, fill: '#64748b' }} axisLine={false} tickLine={false} width={45} />
                      <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '10px', fontSize: '11px' }} />
                      {chartType === 'river' && (
                        <>
                          <Area type="monotone" dataKey="riverHigh" stroke="#f43f5e" fill="#f43f5e" fillOpacity={0.12} isAnimationActive={false} />
                          <Area type="monotone" dataKey="riverMid" stroke="#10b981" fill="#10b981" fillOpacity={0.12} isAnimationActive={false} />
                          <Area type="monotone" dataKey="riverLow" stroke="#3b82f6" fill="#3b82f6" fillOpacity={0.12} isAnimationActive={false} />
                          <Line type="monotone" dataKey="close" stroke="#f8fafc" strokeWidth={2} dot={false} isAnimationActive={false} />
                        </>
                      )}
                      {chartType === 'trend' && <Area type="monotone" dataKey="close" stroke="#f43f5e" fill="#f43f5e" fillOpacity={0.2} strokeWidth={2} isAnimationActive={false} />}
                      {chartType === 'kline' && (
                        <>
                          <Line type="monotone" dataKey="high" stroke="#64748b" strokeWidth={1} dot={false} isAnimationActive={false} />
                          <Line type="monotone" dataKey="low" stroke="#64748b" strokeWidth={1} dot={false} isAnimationActive={false} />
                          <Bar dataKey="close" barSize={6} isAnimationActive={false}>
                            {chartData.map((e, idx) => <Cell key={idx} fill={e.close >= e.open ? '#f43f5e' : '#10b981'} />)}
                          </Bar>
                        </>
                      )}
                      {chartType !== 'river' && showBB && (
                        <>
                          <Line type="monotone" dataKey="bbUpper" stroke="#06b6d4" strokeWidth={1.2} strokeDasharray="4 4" dot={false} isAnimationActive={false} />
                          <Line type="monotone" dataKey="bbLower" stroke="#06b6d4" strokeWidth={1.2} strokeDasharray="4 4" dot={false} isAnimationActive={false} />
                        </>
                      )}
                      {chartType !== 'river' && showMA && (
                        <>
                          <Line type="monotone" dataKey="ma5" stroke="#f59e0b" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                          <Line type="monotone" dataKey="ma20" stroke="#a855f7" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                          <Line type="monotone" dataKey="ma60" stroke="#38bdf8" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                        </>
                      )}
                    </ComposedChart>
                  </ResponsiveContainer>
                </div>

                <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                  <div className="flex gap-1.5">
                    {[{ id: 'kd', label: 'KD (9,3,3)' }, { id: 'macd', label: 'MACD' }, { id: 'rsi', label: 'RSI (14)' }, { id: 'volume', label: '成交量' }].map(ind => (
                      <button key={ind.id} onClick={() => setSubIndicator(ind.id)} className={`px-2.5 py-1 rounded-lg text-[10px] font-bold ${subIndicator === ind.id ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'}`}>{ind.label}</button>
                    ))}
                  </div>
                </div>

                <div className="h-[110px] w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <ComposedChart data={chartData}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#1e293b" />
                      <XAxis dataKey="date" hide />
                      <YAxis domain={['auto', 'auto']} orientation="right" tick={{ fontSize: 9, fill: '#64748b' }} axisLine={false} tickLine={false} width={45} />
                      {subIndicator === 'kd' && (
                        <>
                          <ReferenceLine y={80} stroke="#f43f5e" strokeDasharray="3 3" />
                          <ReferenceLine y={20} stroke="#10b981" strokeDasharray="3 3" />
                          <Line type="monotone" dataKey="k" stroke="#f59e0b" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                          <Line type="monotone" dataKey="d" stroke="#a855f7" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                        </>
                      )}
                      {subIndicator === 'macd' && (
                        <>
                          <Bar dataKey="osc" barSize={5} isAnimationActive={false}>
                            {chartData.map((e, i) => <Cell key={i} fill={e.osc >= 0 ? '#f43f5e' : '#10b981'} />)}
                          </Bar>
                          <Line type="monotone" dataKey="dif" stroke="#f59e0b" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                          <Line type="monotone" dataKey="macd" stroke="#06b6d4" strokeWidth={1.5} dot={false} isAnimationActive={false} />
                        </>
                      )}
                      {subIndicator === 'rsi' && <Line type="monotone" dataKey="rsi" stroke="#6366f1" strokeWidth={1.8} dot={false} isAnimationActive={false} />}
                      {subIndicator === 'volume' && (
                        <Bar dataKey="volume" barSize={6} isAnimationActive={false}>
                          {chartData.map((e, i) => <Cell key={i} fill={e.close >= e.open ? '#f43f5e' : '#10b981'} />)}
                        </Bar>
                      )}
                    </ComposedChart>
                  </ResponsiveContainer>
                </div>
              </>
            ) : (
              <div className="h-[300px] flex flex-col items-center justify-center gap-2 text-slate-400">
                <button onClick={() => loadChart(true)} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">重新載入歷史圖表</button>
              </div>
            )}
          </div>

          <div className="p-4 rounded-2xl border border-indigo-500/30 bg-indigo-950/20 space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-bold text-indigo-300 flex items-center gap-1.5"><Sparkles size={14} /> AI 首席策略師：技術指標與支撐壓力診斷</span>
              <button onClick={() => setAiAnalysis(buildSmartStrategyReport(stock, latestCandle))} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl">生成深度診斷</button>
            </div>
            {aiAnalysis && <div className="text-xs leading-relaxed text-slate-200 whitespace-pre-line bg-slate-950/70 p-3.5 rounded-xl border border-slate-800">{aiAnalysis}</div>}
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<StockMasterApp />);
  </script>
</body>
</html>
